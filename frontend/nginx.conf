server {
  # The unprivileged nginx image runs as a non-root user, so it cannot bind 80.
  # docker-compose maps host 3000 onto this port.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers live at server level and are inherited.
  #
  # nginx does not merge `add_header` from an outer block into an inner block
  # that declares its own, so no location below uses `add_header` — they use
  # `expires`, which emits Cache-Control on its own.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # `^~` matters. nginx evaluates *regex* locations before *plain prefix*
  # locations, so a bare `location /api/` would lose to the asset regex and
  # `/api/anything.js` would be served from disk (a 404) instead of proxied.
  location ^~ /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The camera probe and snapshot endpoints can take ~10 s server-side.
    proxy_read_timeout 60s;
  }

  # Vite emits content-hashed filenames, so these are immutable in practice.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # The HTML shell must be revalidated, or a deploy leaves clients on the
  # previous bundle until they hard-refresh.
  location = /index.html {
    expires -1;
  }

  # SPA fallback: unknown paths render the shell and the client router resolves
  # them.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
