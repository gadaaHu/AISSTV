services:
  postgres:
    image: postgres:16
    container_name: attendance-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: attendance
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: attendance-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: attendance-backend
    environment:
      ENV: dev
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/attendance
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: attendance/+/+/+/events
      MQTT_CLIENT_ID: backend-consumer
      JWT_SECRET: dev-secret-change-me-in-production
      JWT_EXPIRE_MINUTES: "480"
      BOOTSTRAP_ADMIN_USER: admin
      BOOTSTRAP_ADMIN_PASSWORD: admin123
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:4000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    command: >
      sh -c "python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: attendance-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  edge:
    build: ./edge
    container_name: attendance-edge
    depends_on:
      mosquitto:
        condition: service_healthy
    # Warning: Mapping /dev/video0 works on Linux, but not directly on Windows Docker Desktop.
    # If using Windows, change the config.docker.yaml to use an RTSP stream instead of '0'.
    # devices:
    #   - /dev/video0:/dev/video0

volumes:
  pgdata:
  mosquitto_data:
